<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הדף לא נמצא | שליטה בקידום ממומן</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#08090a">
<link rel="icon" href="/username.github.io/logo.jpg">
<style>
@font-face{
  font-family:'Heebo';font-style:normal;font-weight:400 800;font-display:swap;
  src:url(/username.github.io/heebo-he.woff2) format('woff2');
  unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 20px;
  font-family:'Heebo',-apple-system,"Segoe UI","Noto Sans Hebrew",Arial,sans-serif;
  background:#08090a;color:#f2f5f8;line-height:1.65;text-align:center;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(680px 500px at 70% 4%,rgba(91,176,255,.16),transparent 62%),
    radial-gradient(560px 440px at 12% 88%,rgba(120,90,255,.10),transparent 60%);
}
img{width:84px;height:84px;border-radius:22px;border:1px solid rgba(255,255,255,.16);margin:0 auto 26px;display:block}
.code{
  display:inline-block;padding:6px 16px;border-radius:999px;margin-bottom:18px;
  background:rgba(91,176,255,.13);border:1px solid rgba(91,176,255,.26);
  color:#c3e0ff;font-size:14px;font-weight:600;letter-spacing:.5px;
}
h1{font-size:clamp(28px,5vw,44px);margin:0 0 14px;font-weight:800;letter-spacing:-.6px}
p{color:#a4abb3;font-size:17.5px;margin:0 auto 30px;max-width:440px}
a.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:15px 30px;border-radius:14px;background:#fff;color:#0b0c0d;
  text-decoration:none;font-weight:700;font-size:16.5px;
  box-shadow:0 10px 26px rgba(255,255,255,.13);transition:transform .18s ease,background .18s ease;
}
a.btn:hover{transform:translateY(-2px);background:#e8edf2}
@media(prefers-reduced-motion:reduce){*{transition:none!important}a.btn:hover{transform:none}}
:focus-visible{outline:2px solid #5bb0ff;outline-offset:3px;border-radius:8px}
</style>
</head>
<body>
<main>
  <img src="/username.github.io/logo.jpg" alt="" width="84" height="84">
  <div class="code">שגיאה 404</div>
  <h1>הדף הזה לא קיים</h1>
  <p>כנראה שהקישור שגוי או שהדף הוסר. אפשר לחזור לעמוד הראשי ולראות מה כולל הליווי.</p>
  <a class="btn" href="/username.github.io/">חזרה לעמוד הראשי</a>
</main>
</body>
</html>
